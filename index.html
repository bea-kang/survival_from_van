<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RentGuard Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #fafaf8; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  input, select, button { font-family: inherit; }
  button { cursor: pointer; }

  /* Onboarding */
  .onboard-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .onboard-inner { width: 100%; max-width: 440px; padding: 0 24px; transition: opacity 0.2s ease; }
  .step-label { font-size: 13px; color: #999; margin-bottom: 6px; font-weight: 500; }
  .step-title { font-size: 22px; font-weight: 700; margin-bottom: 20px; }
  .btn-primary { width: 100%; padding: 14px 0; border-radius: 6px; border: none; background: #1a1a1a; color: #fff; font-size: 15px; font-weight: 600; }
  .btn-primary:hover { background: #333; }
  .bedroom-btn { flex: 1; padding: 12px 0; border-radius: 6px; font-size: 14px; font-weight: 600; transition: all 0.15s; }
  .bedroom-btn.active { border: 2px solid #1a1a1a; background: #1a1a1a; color: #fff; }
  .bedroom-btn:not(.active) { border: 1px solid #ddd; background: #fff; color: #333; }

  /* Header */
  .header { background: #fff; border-bottom: 1px solid #e8e8e6; padding: 0 24px; position: sticky; top: 0; z-index: 10; }
  .header-inner { max-width: 600px; margin: 0 auto; }
  .nav-btn { background: none; border: none; border-bottom: 2px solid transparent; color: #999; font-size: 14px; font-weight: 600; padding: 12px 16px; transition: all 0.15s; }
  .nav-btn.active { border-bottom-color: #1a1a1a; color: #1a1a1a; }
  .nav-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #22805a; margin-left: 6px; vertical-align: middle; }

  /* Main */
  .main { max-width: 600px; margin: 0 auto; padding: 16px 24px 40px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-input { flex: 1; padding: 10px 12px; border-radius: 6px; border: 1px solid #e0e0de; font-size: 14px; background: #fff; outline: none; }
  .search-input:focus { border-color: #bbb; }
  .source-select { padding: 10px 12px; border-radius: 6px; border: 1px solid #e0e0de; font-size: 14px; background: #fff; color: #333; }
  .count { font-size: 13px; color: #999; margin-bottom: 12px; }

  /* Card */
  .card { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 18px 20px; cursor: pointer; transition: box-shadow 0.15s; margin-bottom: 10px; }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-address { font-size: 13px; color: #888; margin-top: 4px; }
  .card-price { font-size: 18px; font-weight: 700; }
  .card-prev-price { font-size: 12px; color: #999; text-decoration: line-through; }
  .tag { font-size: 12px; color: #666; background: #f4f4f2; padding: 2px 8px; border-radius: 3px; display: inline-block; }
  .tag-verified { color: #22805a; background: #e0f3ec; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; }
  .risk-tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 4px; margin-left: auto; }
  .inquiry-bar { margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0ee; font-size: 12px; font-weight: 500; }

  /* Detail */
  .back-btn { background: none; border: none; color: #666; font-size: 14px; padding: 12px 0; display: flex; align-items: center; gap: 4px; }
  .detail-card { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 24px; margin-bottom: 16px; }
  .detail-title { font-size: 22px; font-weight: 700; }
  .detail-price { font-size: 24px; font-weight: 700; }
  .photo-placeholder { background: #f4f4f2; border-radius: 6px; height: 180px; display: flex; align-items: center; justify-content: center; margin-top: 16px; color: #bbb; font-size: 14px; }
  .detail-desc { font-size: 15px; line-height: 1.7; color: #444; margin-top: 20px; }
  .scam-card { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 20px 24px; }
  .risk-bar-bg { height: 6px; background: #f0f0ee; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .risk-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
  .flag-list { margin: 0; padding: 0; list-style: none; }
  .flag-item { font-size: 14px; color: #555; line-height: 1.7; padding-left: 16px; position: relative; }
  .flag-dot { position: absolute; left: 0; }
  .inquiry-status-box { margin-top: 20px; padding: 14px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; }

  /* Checkbox */
  .card-checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid #ccc; appearance: none; -webkit-appearance: none; cursor: pointer; flex-shrink: 0; margin-top: 2px; transition: all 0.15s; }
  .card-checkbox:checked { background: #1a1a1a; border-color: #1a1a1a; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2.5-2.5a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3E%3C/svg%3E"); background-size: 14px; background-position: center; background-repeat: no-repeat; }
  .card-checkbox:hover { border-color: #999; }
  .bulk-bar { position: sticky; bottom: 0; background: #fff; border-top: 1px solid #e8e8e6; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10; max-width: 600px; margin: 0 auto; }
  .bulk-btn { padding: 10px 20px; border-radius: 6px; border: none; background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 600; }
  .bulk-btn:hover { background: #333; }
  .bulk-btn:disabled { background: #ccc; cursor: default; }
  .select-all-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; color: #666; cursor: pointer; }

  /* Inbox */
  .inbox-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
  .inbox-empty { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 40px 24px; text-align: center; color: #999; font-size: 14px; }
  .inbox-item { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 16px 20px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .inbox-status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 4px; }

  /* Profile */
  .profile-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
  .profile-section { background: #fff; border-radius: 8px; border: 1px solid #e8e8e6; padding: 20px 24px; margin-bottom: 16px; }
  .profile-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .field-group { margin-bottom: 16px; }
  .field-group:last-child { margin-bottom: 0; }
  .field-label { font-size: 13px; color: #888; margin-bottom: 6px; display: block; }
  .field-input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #e0e0de; font-size: 14px; background: #fff; outline: none; box-sizing: border-box; }
  .field-input:focus { border-color: #999; }
  .field-row { display: flex; gap: 12px; }
  .field-row > .field-group { flex: 1; }
  .template-preview { background: #f8f8f6; border: 1px solid #e8e8e6; border-radius: 6px; padding: 16px; font-size: 14px; line-height: 1.7; color: #444; white-space: pre-wrap; }
  .template-textarea { width: 100%; min-height: 160px; padding: 14px; border-radius: 6px; border: 1px solid #e0e0de; font-size: 14px; line-height: 1.7; background: #fff; outline: none; resize: vertical; box-sizing: border-box; font-family: inherit; }
  .template-textarea:focus { border-color: #999; }
  .template-vars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .template-var { font-size: 11px; color: #666; background: #f0f0ee; padding: 2px 8px; border-radius: 3px; cursor: pointer; }
  .template-var:hover { background: #e4e4e2; }
  .btn-save { padding: 10px 24px; border-radius: 6px; border: none; background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 600; }
  .btn-save:hover { background: #333; }
  .btn-outline { padding: 10px 24px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #333; font-size: 14px; font-weight: 600; }
  .btn-outline:hover { border-color: #bbb; }
  .saved-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; z-index: 100; animation: fadeInUp 0.2s ease; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.2/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;

const MOCK_LISTINGS = [
  { id:1, title:"Bright 1BR in Kitsilano", address:"2145 W 4th Ave, Vancouver", price:2100, prevPrice:2300, bedrooms:1, source:"Craigslist", scamScore:12, scamFlags:[], posted:"2 days ago", status:"price_drop", statusLabel:"Price dropped $200", description:"Sunny south-facing unit with hardwood floors, in-suite laundry, and a small balcony. Walking distance to Kits Beach. Available June 1. Utilities included.", photos:6, verified:false, inquiryStatus:null },
  { id:2, title:"Studio near Commercial Dr", address:"1820 E 1st Ave, Vancouver", price:1650, prevPrice:null, bedrooms:0, source:"Liv.rent", scamScore:5, scamFlags:[], posted:"5 hours ago", status:"new", statusLabel:"New listing", description:"Cozy studio in a quiet building. Shared laundry on-site. Close to SkyTrain and Commercial Drive shops. Pet-friendly. Available immediately.", photos:4, verified:true, inquiryStatus:null },
  { id:3, title:"2BR Furnished - Downtown", address:"888 Homer St, Vancouver", price:1800, prevPrice:null, bedrooms:2, source:"Facebook", scamScore:78, scamFlags:["Price 40% below market average","Stock photos detected","Landlord unresponsive to verification"], posted:"1 day ago", status:"warning", statusLabel:"High scam risk", description:"Beautiful fully furnished 2 bedroom apartment in Yaletown. Amazing views. Available now. First and last month required. Wire transfer only.", photos:3, verified:false, inquiryStatus:null },
  { id:4, title:"1BR+Den in Mount Pleasant", address:"345 W 10th Ave, Vancouver", price:2400, prevPrice:null, bedrooms:1, source:"Kijiji", scamScore:22, scamFlags:[], posted:"3 days ago", status:"active", statusLabel:null, description:"Renovated 1BR+den in a modern low-rise. Quartz counters, stainless appliances, bike storage. Near Main St shops. 12-month lease preferred.", photos:8, verified:false, inquiryStatus:"sent" },
  { id:5, title:"Shared 2BR near UBC", address:"3655 W 10th Ave, Vancouver", price:1100, prevPrice:null, bedrooms:1, source:"Craigslist", scamScore:45, scamFlags:["Contact email differs from listing","Re-posted 3 times in 2 weeks"], posted:"6 hours ago", status:"reposted", statusLabel:"Re-posted", description:"Private room in a shared 2BR apartment. Furnished. Close to UBC campus. Looking for quiet, clean roommate. 6-month minimum.", photos:2, verified:false, inquiryStatus:null },
  { id:6, title:"1BR in Gastown Heritage", address:"55 Water St, Vancouver", price:2250, prevPrice:2250, bedrooms:1, source:"Liv.rent", scamScore:8, scamFlags:[], posted:"1 week ago", status:"removed", statusLabel:"Listing removed", description:"Character 1BR in a converted heritage building. Exposed brick, high ceilings. Steps from Waterfront Station. No pets.", photos:5, verified:true, inquiryStatus:"replied" },
];

const SOURCES = ["All sources","Craigslist","Kijiji","Liv.rent","Facebook"];

function scamColor(s) { return s <= 20 ? "#22805a" : s <= 50 ? "#a68307" : "#c43b3b"; }
function scamLabel(s) { return s <= 20 ? "Low risk" : s <= 50 ? "Medium risk" : "High risk"; }

const statusMap = {
  price_drop: { bg:"#e0f3ec", color:"#1a6b4a", icon:"↓" },
  new: { bg:"#e0ecf8", color:"#2a5a8f", icon:"★" },
  warning: { bg:"#fce8e8", color:"#b53030", icon:"!" },
  reposted: { bg:"#fef3e0", color:"#8a6914", icon:"↻" },
  removed: { bg:"#f0f0f0", color:"#888", icon:"×" },
};

function Badge({ status, label }) {
  const s = statusMap[status];
  if (!s) return null;
  return <span className="badge" style={{ background:s.bg, color:s.color }}><span>{s.icon}</span> {label}</span>;
}

/* ── Onboarding ── */
function Onboarding({ onComplete }) {
  const [step, setStep] = useState(0);
  const [budget, setBudget] = useState(2500);
  const [bedrooms, setBedrooms] = useState("any");
  const [moveIn, setMoveIn] = useState("");
  const [fade, setFade] = useState(true);

  useEffect(() => { setFade(true); }, [step]);
  const next = () => { setFade(false); setTimeout(() => setStep(s => s+1), 200); };

  const inner = (children) => (
    <div className="onboard-wrap">
      <div className="onboard-inner" style={{ opacity: fade ? 1 : 0 }}>{children}</div>
    </div>
  );

  if (step === 0) return inner(<>
    <h1 style={{ fontSize:28, fontWeight:700, marginBottom:6 }}>RentGuard</h1>
    <p style={{ color:"#666", fontSize:15, lineHeight:1.6, marginBottom:32 }}>
      Set your criteria once. We'll monitor listings across sources, flag scams, and send inquiries for you.
    </p>
    <button className="btn-primary" onClick={next}>Get started</button>
  </>);

  if (step === 1) return inner(<>
    <p className="step-label">Step 1 of 3</p>
    <h2 className="step-title">What's your budget?</h2>
    <p style={{ color:"#666", fontSize:14, marginBottom:24 }}>City: Vancouver (v1 only)</p>
    <input type="range" min={800} max={4000} step={50} value={budget} onChange={e => setBudget(+e.target.value)} style={{ width:"100%", accentColor:"#1a1a1a" }} />
    <div style={{ display:"flex", justifyContent:"space-between", fontSize:13, color:"#999", marginTop:4, marginBottom:24 }}>
      <span>$800</span><span style={{ fontSize:20, fontWeight:700, color:"#1a1a1a" }}>${budget}/mo</span><span>$4,000</span>
    </div>
    <button className="btn-primary" onClick={next}>Next</button>
  </>);

  if (step === 2) return inner(<>
    <p className="step-label">Step 2 of 3</p>
    <h2 className="step-title">How many bedrooms?</h2>
    <div style={{ display:"flex", gap:8, marginBottom:28 }}>
      {["any","studio","1","2","3+"].map(v => (
        <button key={v} className={`bedroom-btn ${bedrooms===v?"active":""}`} onClick={() => setBedrooms(v)}>
          {v==="any"?"Any":v==="studio"?"Studio":v}
        </button>
      ))}
    </div>
    <button className="btn-primary" onClick={next}>Next</button>
  </>);

  if (step === 3) return inner(<>
    <p className="step-label">Step 3 of 3</p>
    <h2 className="step-title">When are you moving?</h2>
    <input type="date" value={moveIn} onChange={e => setMoveIn(e.target.value)}
      style={{ width:"100%", padding:"14px 12px", borderRadius:6, border:"1px solid #ddd", fontSize:15, marginBottom:28 }} />
    <button className="btn-primary" onClick={() => onComplete({ budget, bedrooms, moveIn })}>See listings</button>
  </>);
}

/* ── Listing Card ── */
function ListingCard({ listing: l, onClick, checked, onCheck }) {
  return (
    <div className="card" onClick={() => onClick(l)}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8 }}>
        <div style={{ display:"flex", gap:12, alignItems:"flex-start" }}>
          <input type="checkbox" className="card-checkbox" checked={checked} onChange={() => onCheck(l.id)}
            onClick={e => e.stopPropagation()} />
          <div>
          <h3 className="card-title">{l.title}</h3>
          <p className="card-address">{l.address}</p>
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <span className="card-price">${l.price.toLocaleString()}</span>
          <span style={{ fontSize:13, color:"#999" }}>/mo</span>
          {l.prevPrice && l.prevPrice !== l.price && <div className="card-prev-price">${l.prevPrice.toLocaleString()}</div>}
        </div>
      </div>
      <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
        <span className="tag">{l.source}</span>
        <span className="tag">{l.bedrooms===0?"Studio":l.bedrooms+"BR"}</span>
        <span className="tag">{l.posted}</span>
        {l.verified && <span className="tag tag-verified">Verified</span>}
        <Badge status={l.status} label={l.statusLabel} />
        <span className="risk-tag" style={{ color:scamColor(l.scamScore), background:scamColor(l.scamScore)+"11" }}>
          {scamLabel(l.scamScore)} · {l.scamScore}
        </span>
      </div>
      {l.inquiryStatus && (
        <div className="inquiry-bar" style={{ color: l.inquiryStatus==="replied"?"#22805a":"#8a6914" }}>
          {l.inquiryStatus==="sent"?"Inquiry sent — awaiting reply":"Landlord replied"}
        </div>
      )}
    </div>
  );
}

/* ── Listing Detail ── */
function ListingDetail({ listing: l, onBack, onInquiry }) {
  return (
    <div style={{ maxWidth:600, margin:"0 auto" }}>
      <button className="back-btn" onClick={onBack}>← Back to listings</button>
      <div className="detail-card">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:4 }}>
          <h2 className="detail-title">{l.title}</h2>
          <div style={{ textAlign:"right" }}>
            <span className="detail-price">${l.price.toLocaleString()}</span>
            <span style={{ color:"#999" }}>/mo</span>
          </div>
        </div>
        <p style={{ color:"#888", fontSize:14, margin:"4px 0 16px" }}>{l.address}</p>
        <Badge status={l.status} label={l.statusLabel} />
        <div className="photo-placeholder">{l.photos} photos</div>
        <div style={{ display:"flex", gap:8, marginTop:16, flexWrap:"wrap" }}>
          <span className="tag">{l.source}</span>
          <span className="tag">{l.bedrooms===0?"Studio":l.bedrooms+" bedroom"}</span>
          <span className="tag">{l.posted}</span>
          {l.verified && <span className="tag tag-verified">Landlord verified</span>}
        </div>
        <p className="detail-desc">{l.description}</p>
        {!l.inquiryStatus ? (
          <button className="btn-primary" style={{ marginTop:20 }} onClick={() => onInquiry(l.id)}>Send inquiry</button>
        ) : (
          <div className="inquiry-status-box" style={{ background: l.inquiryStatus==="replied"?"#e0f3ec":"#fef3e0", color: l.inquiryStatus==="replied"?"#1a6b4a":"#8a6914" }}>
            {l.inquiryStatus==="sent"?"Inquiry sent — awaiting reply":"Landlord replied — check your inbox"}
          </div>
        )}
      </div>
      <div className="scam-card">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
          <h3 style={{ fontSize:15, fontWeight:600 }}>Scam Analysis</h3>
          <span style={{ fontSize:14, fontWeight:700, color:scamColor(l.scamScore) }}>{scamLabel(l.scamScore)} · {l.scamScore}/100</span>
        </div>
        <div className="risk-bar-bg">
          <div className="risk-bar-fill" style={{ width:l.scamScore+"%", background:scamColor(l.scamScore) }} />
        </div>
        {l.scamFlags.length > 0 ? (
          <ul className="flag-list">
            {l.scamFlags.map((f,i) => <li key={i} className="flag-item"><span className="flag-dot" style={{ color:scamColor(l.scamScore) }}>·</span>{f}</li>)}
          </ul>
        ) : (
          <p style={{ fontSize:14, color:"#888" }}>No flags detected. Address, photos, and contact info checked against known patterns.</p>
        )}
      </div>
    </div>
  );
}

/* ── Inbox ── */
function InboxView({ listings }) {
  const inquiries = listings.filter(l => l.inquiryStatus);
  return (
    <div style={{ maxWidth:600, margin:"0 auto" }}>
      <h2 className="inbox-title">Inquiry Inbox</h2>
      {inquiries.length === 0 ? (
        <div className="inbox-empty">No inquiries sent yet. Tap "Send inquiry" on a listing to get started.</div>
      ) : inquiries.map(l => (
        <div key={l.id} className="inbox-item">
          <div>
            <h3 style={{ fontSize:15, fontWeight:600 }}>{l.title}</h3>
            <p style={{ fontSize:13, color:"#888", marginTop:2 }}>{l.source} · ${l.price.toLocaleString()}/mo</p>
          </div>
          <span className="inbox-status" style={{ background: l.inquiryStatus==="replied"?"#e0f3ec":"#fef3e0", color: l.inquiryStatus==="replied"?"#1a6b4a":"#8a6914" }}>
            {l.inquiryStatus==="replied"?"Replied":"Sent"}
          </span>
        </div>
      ))}
    </div>
  );
}

const DEFAULT_TEMPLATE = `Hi,

I'm writing to inquire about your listing at {{address}}.

I'm a newcomer to Vancouver on a work permit and I'm looking for a {{bedrooms}} starting {{move_in_date}}. My budget is up to {{budget}}/month.

I'm unable to visit in person before signing, so I'd appreciate any additional photos or a video walkthrough if possible. I'm happy to provide references and proof of employment.

Could you let me know if the unit is still available?

Thank you,
{{name}}`;

/* ── Profile ── */
function ProfileView({ criteria, onSave, inquiryTemplate, onSaveTemplate }) {
  const [budget, setBudget] = useState(criteria.budget);
  const [bedrooms, setBedrooms] = useState(criteria.bedrooms);
  const [moveIn, setMoveIn] = useState(criteria.moveIn || "");
  const [name, setName] = useState(criteria.name || "");
  const [email, setEmail] = useState(criteria.email || "");
  const [template, setTemplate] = useState(inquiryTemplate);
  const [editing, setEditing] = useState(false);
  const [toast, setToast] = useState(false);

  const bedroomLabel = (v) => v === "any" ? "any bedroom" : v === "studio" ? "a studio" : v + " bedroom";

  const renderPreview = () => {
    return template
      .replace(/\{\{address\}\}/g, "2145 W 4th Ave, Vancouver")
      .replace(/\{\{bedrooms\}\}/g, bedroomLabel(bedrooms))
      .replace(/\{\{move_in_date\}\}/g, moveIn || "TBD")
      .replace(/\{\{budget\}\}/g, "$" + budget.toLocaleString())
      .replace(/\{\{name\}\}/g, name || "Your Name");
  };

  const save = () => {
    onSave({ ...criteria, budget, bedrooms, moveIn, name, email });
    onSaveTemplate(template);
    setEditing(false);
    setToast(true);
    setTimeout(() => setToast(false), 2000);
  };

  const insertVar = (v) => {
    setTemplate(prev => prev + v);
  };

  return (
    <div style={{ maxWidth: 600, margin: "0 auto" }}>
      <h2 className="profile-title">Profile</h2>

      {/* Personal info */}
      <div className="profile-section">
        <h3>Your info</h3>
        <div className="field-row">
          <div className="field-group">
            <label className="field-label">Name</label>
            <input className="field-input" value={name} onChange={e => setName(e.target.value)} placeholder="Your name" />
          </div>
          <div className="field-group">
            <label className="field-label">Email</label>
            <input className="field-input" type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@email.com" />
          </div>
        </div>
      </div>

      {/* Search criteria */}
      <div className="profile-section">
        <h3>Search criteria</h3>
        <div className="field-group">
          <label className="field-label">City</label>
          <input className="field-input" value="Vancouver" disabled style={{ color: "#999", background: "#fafaf8" }} />
        </div>
        <div className="field-group">
          <label className="field-label">Max budget ($/mo)</label>
          <input type="range" min={800} max={4000} step={50} value={budget} onChange={e => setBudget(+e.target.value)} style={{ width: "100%", accentColor: "#1a1a1a" }} />
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: "#999", marginTop: 4 }}>
            <span>$800</span><span style={{ fontWeight: 700, color: "#1a1a1a" }}>${budget}/mo</span><span>$4,000</span>
          </div>
        </div>
        <div className="field-row">
          <div className="field-group">
            <label className="field-label">Bedrooms</label>
            <div style={{ display: "flex", gap: 6 }}>
              {["any", "studio", "1", "2", "3+"].map(v => (
                <button key={v} className={`bedroom-btn ${bedrooms === v ? "active" : ""}`}
                  style={{ padding: "8px 0", fontSize: 13 }}
                  onClick={() => setBedrooms(v)}>
                  {v === "any" ? "Any" : v === "studio" ? "Studio" : v}
                </button>
              ))}
            </div>
          </div>
          <div className="field-group">
            <label className="field-label">Move-in date</label>
            <input className="field-input" type="date" value={moveIn} onChange={e => setMoveIn(e.target.value)} />
          </div>
        </div>
      </div>

      {/* Inquiry template */}
      <div className="profile-section">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ margin: 0 }}>Inquiry template</h3>
          <button className="btn-outline" style={{ padding: "6px 14px", fontSize: 13 }} onClick={() => setEditing(!editing)}>
            {editing ? "Preview" : "Edit"}
          </button>
        </div>
        {editing ? (
          <>
            <textarea className="template-textarea" value={template} onChange={e => setTemplate(e.target.value)} />
            <div className="template-vars">
              <span style={{ fontSize: 11, color: "#999" }}>Insert:</span>
              {["{{name}}", "{{address}}", "{{bedrooms}}", "{{budget}}", "{{move_in_date}}"].map(v => (
                <span key={v} className="template-var" onClick={() => insertVar(v)}>{v}</span>
              ))}
            </div>
          </>
        ) : (
          <>
            <div className="template-preview">{renderPreview()}</div>
            <p style={{ fontSize: 12, color: "#999", marginTop: 8 }}>This is a preview with sample data. Tap "Edit" to customize.</p>
          </>
        )}
      </div>

      <button className="btn-save" onClick={save}>Save changes</button>
      {toast && <div className="saved-toast">Changes saved</div>}
    </div>
  );
}

/* ── App ── */
function App() {
  const [criteria, setCriteria] = useState(null);
  const [view, setView] = useState("listings");
  const [selected, setSelected] = useState(null);
  const [listings, setListings] = useState(MOCK_LISTINGS);
  const [sourceFilter, setSourceFilter] = useState("All sources");
  const [search, setSearch] = useState("");
  const [checkedIds, setCheckedIds] = useState(new Set());
  const [inquiryTemplate, setInquiryTemplate] = useState(DEFAULT_TEMPLATE);

  const handleInquiry = (id) => {
    setListings(prev => prev.map(l => l.id===id ? {...l, inquiryStatus:"sent"} : l));
    setSelected(prev => prev && prev.id===id ? {...prev, inquiryStatus:"sent"} : prev);
  };

  const toggleCheck = (id) => {
    setCheckedIds(prev => { const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; });
  };

  const handleBulkInquiry = () => {
    setListings(prev => prev.map(l => checkedIds.has(l.id) && !l.inquiryStatus ? {...l, inquiryStatus:"sent"} : l));
    setCheckedIds(new Set());
  };

  if (!criteria) return <Onboarding onComplete={setCriteria} />;

  const filtered = listings.filter(l => {
    if (sourceFilter !== "All sources" && l.source !== sourceFilter) return false;
    if (search && !l.title.toLowerCase().includes(search.toLowerCase()) && !l.address.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  return (<>
    <header className="header">
      <div className="header-inner">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", paddingTop:14 }}>
          <h1 style={{ fontSize:18, fontWeight:700 }}>RentGuard</h1>
          <span style={{ fontSize:12, color:"#999" }}>Vancouver · ${criteria.budget}/mo max</span>
        </div>
        <nav style={{ display:"flex", marginTop:4 }}>
          {[["Listings","listings"],["Inbox","inbox"],["Profile","profile"]].map(([label,v]) => (
            <button key={v} className={`nav-btn ${view===v||(view==="detail"&&v==="listings")?"active":""}`}
              onClick={() => { setView(v); setSelected(null); }}>
              {label}
              {v==="inbox" && listings.some(l => l.inquiryStatus==="replied") && <span className="nav-dot" />}
            </button>
          ))}
        </nav>
      </div>
    </header>
    <main className="main">
      {view === "detail" && selected ? (
        <ListingDetail listing={selected} onBack={() => { setView("listings"); setSelected(null); }} onInquiry={handleInquiry} />
      ) : view === "inbox" ? (
        <InboxView listings={listings} />
      ) : view === "profile" ? (
        <ProfileView criteria={criteria} onSave={setCriteria} inquiryTemplate={inquiryTemplate} onSaveTemplate={setInquiryTemplate} />
      ) : (<>
        <div className="search-row">
          <input className="search-input" placeholder="Search listings..." value={search} onChange={e => setSearch(e.target.value)} />
          <select className="source-select" value={sourceFilter} onChange={e => setSourceFilter(e.target.value)}>
            {SOURCES.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
        <p className="count">{filtered.length} listing{filtered.length!==1?"s":""} found</p>
        <label className="select-all-row" onClick={e => e.preventDefault()}>
          <input type="checkbox" className="card-checkbox"
            checked={filtered.length > 0 && filtered.every(l => checkedIds.has(l.id))}
            onChange={() => {
              const allChecked = filtered.every(l => checkedIds.has(l.id));
              setCheckedIds(prev => {
                const next = new Set(prev);
                filtered.forEach(l => allChecked ? next.delete(l.id) : next.add(l.id));
                return next;
              });
            }} />
          <span>Select all</span>
        </label>
        {filtered.map(l => <ListingCard key={l.id} listing={l} checked={checkedIds.has(l.id)} onCheck={toggleCheck} onClick={l => { setSelected(l); setView("detail"); }} />)}
        {filtered.length===0 && <div style={{ textAlign:"center", padding:"40px 0", color:"#999", fontSize:14 }}>No listings match your filters.</div>}
        {checkedIds.size > 0 && (
          <div className="bulk-bar">
            <span style={{ fontSize:14, color:"#666" }}>{checkedIds.size} selected</span>
            <button className="bulk-btn" onClick={handleBulkInquiry}>Send inquiry to all</button>
          </div>
        )}
      </>)}
    </main>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
